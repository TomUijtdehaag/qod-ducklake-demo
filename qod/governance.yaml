# PROTOTYPE: the whole access model of the demo, loaded by Quack on Demand at boot.
# Identity comes from Keycloak (stand-in for Entra ID / Cognito); its `groups` claim picks the QoD group.
apiVersion: quack-on-demand/v1
kind: ConfigManifest
exportedAt: '1970-01-01T00:00:00Z'
exportedFrom: { managerVersion: bootstrap, hostname: prototype }

tenants:
  - name: demo
    displayName: Demo
    tenantDbs:
      - { name: flights, defaultDatabase: flights, defaultSchema: main }
    pools:
      - { name: bi, tenantDb: flights, roleDistribution: { writeonly: 0, readonly: 0, dual: 1 } }

roles:
  # Writes the tables; full access.
  - tenant: demo
    name: engineer
    permissions:
      - { catalog: flights, schema: '*', table: '*', verb: ALL }

  # Reads everything, but owner contact details are masked.
  - tenant: demo
    name: analyst
    permissions:
      - { catalog: flights, schema: main, table: aircraft,         verb: RO }
      - { catalog: flights, schema: main, table: position_reports, verb: RO }
    columnPolicies:
      - { catalog: '*', schema: main, table: aircraft, column: owner_email, action: mask, transformSql: "'***'" }

  # External partner: only Dutch position reports, never the aircraft registry.
  - tenant: demo
    name: partner
    permissions:
      - { catalog: flights, schema: main, table: position_reports, verb: RO }
    rowPolicies:
      - { catalog: '*', schema: main, table: position_reports, predicateSql: "country = 'NL'" }

groups:
  - { tenant: demo, name: engineers, roles: [engineer] }
  - { tenant: demo, name: analysts,  roles: [analyst] }
  - { tenant: demo, name: partners,  roles: [partner] }

# Accounts exist in QoD but hold no roles: Keycloak checks the password and its `groups` claim decides the role.
# QoD insists on a local password; these are unusable placeholders. In production SCIM (Entra / Okta) provisions
# these rows instead.
users:
  - { tenant: demo, username: alice,   password: not-used-alice-7f3a91, kind: user, poolGrants: [{ pool: bi }] }
  - { tenant: demo, username: bob,     password: not-used-bob-7f3a91, kind: user, poolGrants: [{ pool: bi }] }
  - { tenant: demo, username: carol,   password: not-used-carol-7f3a91, kind: user, poolGrants: [{ pool: bi }] }
  - { tenant: demo, username: mallory, password: not-used-mallory-7f3a91, kind: user, poolGrants: [{ pool: bi }] }
